services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: duplera
      POSTGRES_USER: duplera
      POSTGRES_PASSWORD: duplera
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["duplera-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duplera"]
      interval: 3s
      retries: 10
volumes:
  duplera-db:
